<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Tus hábitos, tu horario de clase, tus exámenes y tareas, en un solo sitio." />
    <title>Rumbo</title>

    <!-- Iconos y ajustes para instalar la app en el iPhone ("Añadir a pantalla de inicio") -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rumbo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      try {
        var t = localStorage.getItem('rumbo.tema')
        if (t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
